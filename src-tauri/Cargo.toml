[package]
name = "codeos"
version = "0.2.0"
description = "CodeOS – Local macOS Development Environment Manager"
authors = ["CodeOS Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-dialog       = "2"
tauri-plugin-opener       = "2"
tauri-plugin-store        = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs           = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
uuid        = { version = "1", features = ["v4"] }
dirs        = "5"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for Claude API (streaming)
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"

# Base64 for image encoding (screenshots → Claude)
base64      = "0.22"

[profile.release]
panic    = "abort"
codegen-units = 1
lto      = true
opt-level = "s"
strip    = true

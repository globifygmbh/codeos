<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codeos.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeOS – Dev Manager</title>
    <script>
      // Immediately apply the correct theme class before React mounts
      // to prevent a flash of the wrong colour scheme.
      (function () {
        const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="bg-[var(--surface-0)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
